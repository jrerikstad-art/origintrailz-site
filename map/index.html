<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Origintrailz Map</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #0f1412; font-family: system-ui, sans-serif; color: #e7e5e4; }
    #bar { position: fixed; z-index: 5; left: 0; right: 0; top: 0; padding: 10px 14px; background: rgba(15,20,18,.88); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    #bar a { color: #a8a29e; }
    #status { font-size: 13px; color: #a8a29e; }
    #frame { position: absolute; inset: 48px 0 0 0; border: 0; width: 100%; height: calc(100% - 48px); }
    button, select { background: #1c1917; color: #fafaf9; border: 1px solid #44403c; border-radius: 6px; padding: 6px 10px; }
  </style>
</head>
<body>
  <div id="bar">
    <strong>Origintrailz /map</strong>
    <a href="/">Home</a>
    <button type="button" id="btnGps">Use device location</button>
    <button type="button" id="btnPick">Choose location (not GPS)</button>
    <span id="status">Loading engine…</span>
  </div>
  <iframe id="frame" title="World Engine" allow="geolocation; fullscreen"></iframe>
  <script type="module">
    /**
     * Signed-in / field map — real World Engine, not the landing GLB header.
     * Engine assets: /map-engine/ (copied from world-lab dist on build).
     * Factory: https://origintrailz.com/api/world
     */
    const FACTORY = 'https://origintrailz.com/api/world';
    const frame = document.getElementById('frame');
    const status = document.getElementById('status');

    function engineUrl(extra = {}) {
      const q = new URLSearchParams({
        mobileWorld: '1',
        liveGps: extra.liveGps || '0',
        factoryBase: FACTORY,
        loadAll: '0',
        ...extra,
      });
      // dropLon/dropLat = labelled picker, never claimed as a GPS visit
      return `/map-engine/index.html?${q.toString()}`;
    }

    function setStatus(msg) {
      status.textContent = msg;
    }

    document.getElementById('btnGps').onclick = () => {
      if (!navigator.geolocation) {
        setStatus('Geolocation unavailable — use Choose location.');
        return;
      }
      setStatus('Requesting location…');
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const { latitude: lat, longitude: lon } = pos.coords;
          setStatus(`GPS ${lat.toFixed(5)}, ${lon.toFixed(5)}`);
          frame.src = engineUrl({ liveGps: '0', dropLat: String(lat), dropLon: String(lon), label: 'gps' });
        },
        (err) => setStatus(`Location denied (${err.message}). Use Choose location.`),
        { enableHighAccuracy: true, timeout: 20000 },
      );
    };

    document.getElementById('btnPick').onclick = () => {
      const raw = prompt(
        'Enter lat,lon for a labelled camera position (NOT recorded as a GPS visit).\nExample Bergura: 58.882,5.869',
        '58.882,5.869',
      );
      if (!raw) return;
      const [latS, lonS] = raw.split(',').map((s) => s.trim());
      const lat = Number(latS);
      const lon = Number(lonS);
      if (!Number.isFinite(lat) || !Number.isFinite(lon)) {
        setStatus('Invalid lat,lon');
        return;
      }
      setStatus(`Picked (not GPS) ${lat.toFixed(5)}, ${lon.toFixed(5)}`);
      frame.src = engineUrl({
        liveGps: '0',
        dropLat: String(lat),
        dropLon: String(lon),
        pickedLocation: '1',
      });
    };

    // Default: Bergura labelled pick so the page is not a blank blue void before permission.
    frame.src = engineUrl({
      liveGps: '0',
      dropLat: '58.882',
      dropLon: '5.869',
      pickedLocation: '1',
    });
    setStatus('Default labelled pick: Bergura (not a GPS visit). Use GPS or Choose location.');
  </script>
</body>
</html>
